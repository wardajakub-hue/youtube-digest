<style>

    --bg: #17161a;
    --surface: #211f24;
    --border: #33313a;
    --text: #eceae6;
    --text-muted: #9c99a3;
    --accent: #e08a6c;
    --accent-soft: #3a2a24;
    --shadow: 0 1px 3px rgba(0,0,0,0.35);
  }
  * { box-sizing: border-box; }
  body {

    margin: 0 0 4px;

  }
  .subtitle {

    font-size: 0.95rem;
    margin: 0;
  }

    margin: 0 auto;
    padding: 0 20px 20px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .controls input, .controls select {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 9px 12px;
    font-size: 0.9rem;
    font-family: inherit;
  }
  .controls input {
    flex: 1 1 220px;
  }
  .controls select {
    flex: 0 0 auto;
  }

    margin: 0 auto;
    padding: 0 20px 60px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 20px;
    box-shadow: var(--shadow);
    display: flex;
    gap: 16px;
  }
  .thumb {

    width: 160px;
    height: 90px;
    border-radius: 8px;
    overflow: hidden;
    background: var(--bg);
    border: 1px solid var(--border);
  }
  .thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .card-body {
    flex: 1 1 auto;
    min-width: 0;
  }
  @media (max-width: 560px) {
    .card {
      flex-direction: column;
    }
    .thumb {
      width: 100%;
      height: 160px;
      flex-basis: auto;
    }
  }
  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 8px;
  }
  .card-title-group {
    min-width: 0;
  }
  .card-title {
    font-size: 1.05rem;
    font-weight: 600;
    margin: 0;
  }
  .card-title a {
    color: var(--text);
    text-decoration: none;
  }
  .card-title a:hover {
    color: var(--accent);
  }
  .card-title-pl {
    margin: 2px 0 0;
    font-size: 0.85rem;
    font-style: italic;
    color: var(--text-muted);
  }
  .badges {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    flex-shrink: 0;
  }
  .badge {

    font-weight: 600;
    padding: 3px 8px;
    border-radius: 99px;
    white-space: nowrap;
  }
  .badge-category {
    background: var(--accent-soft);
    color: var(--accent);
  }
  .badge-channel {

    color: var(--text-muted);
    border: 1px solid var(--border);
  }
  .meta {
    color: var(--text-muted);
    font-size: 0.8rem;
    margin: 0 0 12px;
  }
  ul.points {
    margin: 0 0 10px;
    padding-left: 20px;
  }
  ul.points li {
    margin-bottom: 4px;
    font-size: 0.92rem;
  }
  .audience {
    font-size: 0.85rem;
    color: var(--text-muted);
    font-style: italic;
    border-top: 1px solid var(--border);
    padding-top: 10px;
    margin-top: 10px;
  }
  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--accent);
    text-decoration: none;
    margin-bottom: 10px;
  }
  .source-link:hover {
    text-decoration: underline;
  }
  .empty-state {
    text-align: center;
    color: var(--text-muted);
    padding: 60px 20px;
  }
</style>
</head>

const cardsEl = document.getElementById('cards');
const searchEl = document.getElementById('search');
const channelEl = document.getElementById('channel-filter');
const categoryEl = document.getElementById('category-filter');

function populateFilters() {
  const channels = [...new Set(DATA.map(d => d.channel))].sort();
  const categories = [...new Set(DATA.map(d => d.category))].sort();
  for (const c of channels) {
    const opt = document.createElement('option');
    opt.value = c; opt.textContent = c;
    channelEl.appendChild(opt);
  }
  for (const c of categories) {
    const opt = document.createElement('option');
    opt.value = c; opt.textContent = c;
    categoryEl.appendChild(opt);
  }
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str ?? '';
  return div.innerHTML;
}

function render() {
  const q = searchEl.value.trim().toLowerCase();
  const chan = channelEl.value;
  const cat = categoryEl.value;

  const filtered = DATA.filter(item => {
    if (chan && item.channel !== chan) return false;
    if (cat && item.category !== cat) return false;
    if (q) {
      const haystack = (
        (item.title_en || '') + ' ' + (item.title_pl || '') + ' ' +
        (item.summary_points || []).join(' ') + ' ' + (item.audience_note || '')
      ).toLowerCase();
      if (!haystack.includes(q)) return false;
    }
    return true;
  });

  filtered.sort((a, b) => (b.published_date || '').localeCompare(a.published_date || ''));

  if (filtered.length === 0) {
    cardsEl.innerHTML = '<div class="empty-state">Brak wyników.</div>';
    return;
  }

  cardsEl.innerHTML = filtered.map(item => `
    <article class="card">
      <div class="thumb">
        ${item.thumbnail_url ? `<img src="${escapeHtml(item.thumbnail_url)}" alt="" loading="lazy">` : ''}
      </div>
      <div class="card-body">
        <div class="card-header">
          <div class="card-title-group">
            <h2 class="card-title"><a href="${escapeHtml(item.url)}" target="_blank" rel="noopener">${escapeHtml(item.title_en)}</a></h2>
            ${item.title_pl ? `<p class="card-title-pl">${escapeHtml(item.title_pl)}</p>` : ''}
          </div>
          <div class="badges">
            <span class="badge badge-category">${escapeHtml(item.category)}</span>
            <span class="badge badge-channel">${escapeHtml(item.channel)}</span>
          </div>
        </div>
        <p class="meta">Opublikowano: ${escapeHtml(item.published_date || 'b/d')}</p>
        <a class="source-link" href="${escapeHtml(item.url)}" target="_blank" rel="noopener">Zobacz na YouTube ↗</a>
        <ul class="points">
          ${(item.summary_points || []).map(p => `<li>${escapeHtml(p)}</li>`).join('')}
        </ul>
        <p class="audience">${escapeHtml(item.audience_note || '')}</p>
      </div>
    </article>
  `).join('');
}

populateFilters();
render();
searchEl.addEventListener('input', render);
channelEl.addEventListener('change', render);
categoryEl.addEventListener('change', render);
</script>
</body>
</html>
