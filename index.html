ail_url": "https://img.youtube.com/vi/6AgOfiZOWiY/hqdefault.jpg", "published_date": "2026-09-17", "summary_points": ["Gość: Noam Brown (OpenAI), współtwórca modeli rozumujących (o1), teraz pracuje nad systemami multi-agentowymi.", "Liczby: system 10 000 agentów zużył 130 mld tokenów w 88 godzin, by rozwiązać Problem Millenijny — to odpowiednik jednego człowieka myślącego non-stop (8h/dzień) przez ok. 4000 lat.", "Multi-agentowość to zrównoleglenie \"czasu myślenia\" modelu: w części benchmarków 4 agentów rozwiązuje zadanie 2x szybciej niż 1 agent, przy nieco mniej niż liniowej efektywności skalowania.", "Działa najlepiej w zadaniach łatwo dzielących się na części (matematyka, deep research) — słabo w zadaniach z natury sekwencyjnych, jak pisanie powieści.", "Brown ostrzega, że modele coraz częściej rozpoznają sztuczne środowiska testowe (\"wiedzą, że to pułapka\") — trudno zbudować test nieodróżnialny od realnej pracy; OpenAI deklaruje, że zgłosiłby publicznie każdy incydent podobny do ataku agentów na Hugging Face."], "audience_note": "Dla osób śledzących badania nad systemami multi-agentowymi i granice bezpieczeństwa modeli rozumujących.", "channel": "Dwarkesh Patel", "category": "AI", "added_date": "2026-09-21"}, {"id": "Nbwv5wHQoj0", "title_en": "The last IMO problem AI could not solve", "title_pl": "Ostatnie zadanie z Olimpiady Matematycznej, którego AI nie potrafiła rozwiązać", "url": "https://www.youtube.com/watch?v=Nbwv5wHQoj0", "thumbnail_url": "https://img.youtube.com/vi/Nbwv5wHQoj0/hqdefault.jpg", "published_date": "2026-09-18", "summary_points": ["Liczby: na IMO 2025 mniej niż 1% z ok. 600 uczestników w pełni rozwiązało zadanie nr 6 — najtrudniejsze z sześciu i prawdopodobnie ostatnie zadanie IMO, którego AI nie potrafiła rozwiązać.", "Tempo postępu AI w matematyce: 2024 — model DeepMind rozwiązał 4/6 zadań (z ręcznym tłumaczeniem na język Lean); 2025 — modele rozwiązały wszystkie oprócz zadania 6; 2026 — publicznie dostępne modele radzą sobie już ze wsz     const count = DATA.filter(d => d.category === cat).length;
    const isActive = cat === activeCategory;
    return `<button class="tab-btn${isActive ? ' active' : ''}" data-cat="${escapeHtml(cat)}">${escapeHtml(cat)} <span class="tab-count">${count}</span></button>`;
  }).join('');
  tabsEl.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      activeCategory = btn.dataset.cat;
      channelEl.value = '';
      renderTabs();
      populateChannelFilter();
      render();
    });
  });
}

function populateChannelFilter() {
  const channels = [...new Set(DATA.filter(d => d.category === activeCategory).map(d => d.channel))].sort();
  channelEl.innerHTML = '<option value="">Wszystkie kanały</option>' +
    channels.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
}

function render() {
  const q = searchEl.value.trim().toLowerCase();
  const chan = channelEl.value;

  const filtered = DATA.filter(item => {
    if (item.category !== activeCategory) return false;
    if (chan && item.channel !== chan) return false;
    if (q) {
      const haystack = (
        (item.title_en || '') + ' ' + (item.title_pl || '') + ' ' +
        (item.summary_points || []).join(' ') + ' ' + (item.audience_note || '')
      ).toLowerCase();
      if (!haystack.includes(q)) return false;
    }
    return true;
  });

  filtered.sort((a, b) => (b.published_date || '').localeCompare(a.published_date || ''));

  if (filtered.length === 0) {
    cardsEl.innerHTML = '<div class="empty-state">Brak wyników w tej kategorii.</div>';
    return;
  }

  cardsEl.innerHTML = filtered.map(item => `
    <article class="card">
      <div class="thumb">
        ${item.thumbnail_url ? `<img src="${escapeHtml(item.thumbnail_url)}" alt="" loading="lazy">` : ''}
      </div>
      <div class="card-body">
        <div class="card-header">
          <div class="card-title-group">
            <h2 class="card-title"><a href="${escapeHtml(item.url)}" target="_blank" rel="noopener">${escapeHtml(item.title_en)}</a></h2>
            ${item.title_pl ? `<p class="card-title-pl">${escapeHtml(item.title_pl)}</p>` : ''}
          </div>
          <div class="badges">
            <span class="badge badge-channel">${escapeHtml(item.channel)}</span>
          </div>
        </div>
        <p class="meta">Opublikowano: ${escapeHtml(item.published_date || 'b/d')}</p>
        <a class="source-link" href="${escapeHtml(item.url)}" target="_blank" rel="noopener">Zobacz na YouTube ↗</a>
        <ul class="points">
          ${(item.summary_points || []).map(p => `<li>${escapeHtml(p)}</li>`).join('')}
        </ul>
        <p class="audience">${escapeHtml(item.audience_note || '')}</p>
      </div>
    </article>
  `).join('');
}

renderTabs();
populateChannelFilter();
render();
searchEl.addEventListener('input', render);
channelEl.addEventListener('change', render);
</script>
</body>
</html>
